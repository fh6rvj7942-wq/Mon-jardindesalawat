<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon jardin de Salawat</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8fa;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#693c50}.wrap{max-width:440px;margin:auto;text-align:center;padding:20px 16px 24px;border:1px solid #f1dbe4;border-radius:22px;background:linear-gradient(145deg,#fff8fa,#fbeaf1)}h1{font-size:20px;margin:4px 0 8px}.arabic{font-size:17px;line-height:1.9;margin:0 0 12px}.ring{width:174px;height:174px;position:relative;margin:0 auto 15px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.track{fill:none;stroke:#eed7e1;stroke-width:12}.progress{fill:none;stroke:#bd7597;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s}.center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}.count{font-size:39px;font-weight:750}.small{font-size:12px;color:#926b7b}.actions{display:flex;justify-content:center;gap:10px}button{border:0;border-radius:13px;padding:13px 20px;font-size:15px;font-weight:650;cursor:pointer;background:#bc7697;color:white}button.secondary{background:#f0dce5;color:#78465d}.foot{font-size:12px;color:#9b7485;margin:14px 0 0}</style></head><body><main class="wrap"><h1>🌷 Mon jardin de Salawat</h1><p class="arabic" lang="ar" dir="rtl">اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ</p><div class="ring"><svg viewBox="0 0 180 180" aria-hidden="true"><circle class="track" cx="90" cy="90" r="70"/><circle id="progress" class="progress" cx="90" cy="90" r="70"/></svg><div class="center"><span id="count" class="count">0</span><span class="small">sur 100 salawat</span></div></div><div class="actions"><button id="add">🌸 +1 Salawat</button><button id="reset" class="secondary">↺ Remettre à zéro</button></div><p class="foot">Chaque salawat, un instant de rappel 🤍</p></main><script>const key='mon-jardin-salawat-v1';let count=0;try{count=Math.max(0,Number(localStorage.getItem(key))||0)}catch(e){}const circle=document.getElementById('progress');const circumference=2*Math.PI*70;circle.style.strokeDasharray=circumference;function draw(){document.getElementById('count').textContent=count;circle.style.strokeDashoffset=circumference*(1-Math.min(count/100,1));try{localStorage.setItem(key,String(count))}catch(e){}}document.getElementById('add').addEventListener('click',()=>{count++;draw()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Remettre ton compteur à zéro ?')){count=0;draw()}});draw();</script></body></html>
